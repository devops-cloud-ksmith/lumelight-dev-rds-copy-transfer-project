<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RDS Swap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="p-4">
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      const [status, setStatus] = React.useState('');
      const [instances, setInstances] = React.useState([]);

      const orderOptions = [];
      for (let i = 1; i <= 99; i++) {
        orderOptions.push(i.toString().padStart(2, '0'));
      }

      const handleSubmit = (e) => {
        e.preventDefault();
        const data = new FormData(e.target);
        const payload = {
          orderNo: data.get('orderNo'),
          srcProfiles: {
            'us-west-2': data.get('srcProfileWest'),
            'us-east-2': data.get('srcProfileEast'),
          },
          destProfile: data.get('destProfile'),
          regions: data.get('regions').split(' ').filter(Boolean),
          destRegion: data.get('destRegion'),
          dbClass: data.get('dbClass')
        };
        fetch('/swap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(res => res.json()).then(d => setStatus(JSON.stringify(d))).catch(err => setStatus('Error'));
      };

      const handleFetch = () => {
        const data = new FormData(document.querySelector('form'));
        const params = new URLSearchParams({
          orderNo: data.get('orderNo'),
          regions: data.get('regions'),
          srcProfiles: JSON.stringify({
            'us-west-2': data.get('srcProfileWest'),
            'us-east-2': data.get('srcProfileEast'),
          }),
        });
        fetch('/resources?' + params.toString())
          .then(res => res.json())
          .then(setInstances)
          .catch(() => setInstances([]));
      };

      return (
        <div className="container">
          <h1 className="mb-4">Swap RDS Instances</h1>
          <form onSubmit={handleSubmit}>
            <div className="mb-3">
              <label className="form-label">orderNo</label>
              <select className="form-select" name="orderNo">
                {orderOptions.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="mb-3">
              <label className="form-label">Source Profile (us-west-2)</label>
              <select className="form-select" name="srcProfileWest">
                <option value="prodw">prodw</option>
              </select>
            </div>
            <div className="mb-3">
              <label className="form-label">Source Profile (us-east-2)</label>
              <select className="form-select" name="srcProfileEast">
                <option value="prode">prode</option>
              </select>
            </div>
            <div className="mb-3">
              <label className="form-label">Destination Profile</label>
              <select className="form-select" name="destProfile">
                <option value="devw">devw</option>
              </select>
            </div>
            <div className="mb-3">
              <label className="form-label">Regions (space separated)</label>
              <input className="form-control" name="regions" defaultValue="us-west-2 us-east-2" />
            </div>
            <div className="mb-3">
              <label className="form-label">Destination Region</label>
              <input className="form-control" name="destRegion" defaultValue="us-west-2" />
            </div>
            <div className="mb-3">
              <label className="form-label">DB Class</label>
              <input className="form-control" name="dbClass" defaultValue="db.t3.micro" />
            </div>
            <button type="button" className="btn btn-secondary me-2" onClick={handleFetch}>List Instances</button>
            <button type="submit" className="btn btn-primary">Start</button>
          </form>
          {instances.length > 0 && (
            <ul className="mt-3">
              {instances.map((i, idx) => (
                <li key={idx}>{i.region}: {i.id}</li>
              ))}
            </ul>
          )}
          {status && <pre className="mt-3">{status}</pre>}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
